<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Spam SMS Detector</title>
    <style>
        
        body {
            background: linear-gradient(135deg, #a8e6ff70, #882b96ac) !important;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        .container {
            background: white;
            padding: 40px;
            border-radius: 15px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.2);
            text-align: center;
            max-width: 500px;
            width: 90%;
        }

        h2 {
            margin-bottom: 25px;
            color: #333;
        }

        textarea {
            width: 100%;
            height: 120px;
            padding: 12px;
            border: 2px solid #ddd;
            border-radius: 8px;
            font-size: 16px;
            resize: none;
            box-sizing: border-box;
            outline: none;
            transition: border-color 0.3s;
        }

        textarea:focus {
            border-color: #3f2b96;
        }

        button {
            background-color: #007bff;
            color: white;
            border: none;
            padding: 12px 30px;
            font-size: 16px;
            border-radius: 8px;
            cursor: pointer;
            margin-top: 20px;
            font-weight: bold;
            transition: background-color 0.2s;
        }

        button:hover {
            background-color: #0056b3;
        }

        .result {
            margin-top: 25px;
            font-size: 20px;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <div class="container">
    <h2>📩 Spam SMS Detection</h2>
    <form action="{{ url_for('predict') }}" method="POST">
        <textarea name="message" placeholder="Paste your SMS here..." required>{{ request.form['message'] if request.form else '' }}</textarea>
        <br>
        <button type="submit">Check Message</button>
    </form>

    {% if prediction == 1 %}
        <div class="result" style="color: red;">Result: SPAM</div>
    {% elif prediction == 0 %}
        <div class="result" style="color: green;">Result: Not Spam (Safe)</div>
    {% endif %}
</div>

</body>
</html>
